<nav class="navbar navbar-expand-lg navbar-dark shadow-sm"
     xmlns:th="http://www.thymeleaf.org"
     th:fragment="navbar"
     style="background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);">

    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <span class="d-inline-flex align-items-center justify-content-center rounded-circle"
                  style="width: 38px; height: 38px; background: rgba(255,255,255,0.12);">
                📘
            </span>
            <span>Sistema Asistencia</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavbar"
                aria-controls="menuNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse pt-3 pt-lg-0" id="menuNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-1">

                <li class="nav-item">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/dashboard}">Inicio</a>
                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/usuarios}">Usuarios</a>
                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'',''SECRETARIA'')')}">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/estudiantes}">Estudiantes</a>
                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'',''SECRETARIA'')')}">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/clases}">Clases</a>
                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'',''SECRETARIA'')')}">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/asistencias}">Asistencias</a>
                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'',''SECRETARIA'')')}">
                    <a class="nav-link px-3 rounded-pill" th:href="@{/reportes}">Reportes</a>
                </li>
            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0">

                <a class="btn btn-warning fw-semibold"
                   th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'',''SECRETARIA'')')}"
                   th:href="@{/estudiantes/subir-csv}">
                    Subir CSV
                </a>

                <form th:action="@{/logout}" method="post" class="d-flex">
                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-light">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
