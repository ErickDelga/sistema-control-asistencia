<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Sistema de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" th:href="@{/}">Asistencia</a>

    <ul class="navbar-nav me-auto">

      <li class="nav-item" sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" th:href="@{/admin/dashboard}">Admin</a>
      </li>

      <li class="nav-item" sec:authorize="hasRole('DOCENTE')">
        <a class="nav-link" th:href="@{/docente/dashboard}">Docente</a>
      </li>

      <li class="nav-item" sec:authorize="hasRole('SECRETARIA')">
        <a class="nav-link" th:href="@{/secretaria/dashboard}">Secretaría</a>
      </li>

      <li class="nav-item" sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
      </li>

    </ul>

    <span class="navbar-text text-light me-3"
          sec:authentication="name"></span>

    <form th:action="@{/logout}" method="post">
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>

  </div>
</nav>

<div class="container mt-4"
     th:fragment="layout(contenido)">
  <div th:replace="${contenido}"></div>
</div>

</body>
</html>
