<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

  <div class="page-header">
    <div>
      <h2 class="page-title"
          th:text="${modoEdicion ? 'Editar clase' : 'Nueva clase'}">
        Nueva clase
      </h2>

      <p class="page-subtitle">
        Registra una nueva clase asignando docente, asignatura y grupo académico.
      </p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <form th:action="@{/clases/guardar}" method="post" th:object="${clase}">

        <input type="hidden" th:field="*{id}" />

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label fw-semibold">Asignatura</label>
            <input type="text"
                   th:field="*{asignatura}"
                   class="form-control"
                   placeholder="Ej: Matemática"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Docente</label>
            <select th:field="*{docente.id}" class="form-select" required>
              <option value="">Seleccione docente</option>
              <option th:each="d : ${docentes}"
                      th:value="${d.id}"
                      th:text="${d.nombreCompleto}">
              </option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Año</label>
            <select th:field="*{anio}" class="form-select" required>
              <option value="">Seleccione año</option>
              <option th:each="a : ${anios}"
                      th:value="${a}"
                      th:text="${a}">
              </option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Tipo Bachillerato</label>
            <select th:field="*{tipoBachillerato}" class="form-select" required>
              <option value="">Seleccione tipo</option>
              <option th:each="t : ${tiposBachillerato}"
                      th:value="${t}"
                      th:text="${t.nombreVisible}">
              </option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Sección</label>
            <input type="text"
                   th:field="*{seccion}"
                   class="form-control"
                   maxlength="1"
                   placeholder="A"
                   style="text-transform: uppercase;"
                   required>
          </div>

        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button type="submit"
                  class="btn btn-primary"
                  th:text="${modoEdicion ? 'Actualizar clase' : 'Guardar clase'}">
            Guardar clase
          </button>

          <a th:href="@{/clases}" class="btn btn-outline-secondary">
            Cancelar
          </a>
        </div>

      </form>

    </div>
  </div>

  <script>
    (function () {
      const seccionInput = document.querySelector('input[name="seccion"]');

      if (seccionInput) {
        seccionInput.addEventListener('input', function () {
          this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').substring(0, 1);
        });
      }
    })();
  </script>

</div>
</html>
