<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="mb-1">Clases</h2>
            <p class="text-muted mb-0">
                Listado de clases registradas en el sistema.
            </p>
        </div>

        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'')')}"
           th:href="@{/clases/crear}"
           class="btn btn-primary">
            Nueva clase
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(clases)}" class="alert alert-warning mb-0">
                No hay clases registradas.
            </div>

            <div th:unless="${#lists.isEmpty(clases)}" class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Asignatura</th>
                        <th>Año</th>
                        <th>Tipo Bachillerato</th>
                        <th>Sección</th>
                        <th>Docente</th>
                        <th>Fecha creación</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clases}">
                        <td th:text="${c.id}">1</td>
                        <td th:text="${c.asignatura}">Matemática</td>
                        <td th:text="${c.anio}">PRIMERO</td>
                        <td th:text="${c.tipoBachillerato}">GENERAL</td>
                        <td th:text="${c.seccion}">A</td>
                        <td th:text="${c.docente != null ? c.docente.nombreCompleto : 'Sin docente'}">Docente</td>
                        <td th:text="${c.fechaCreacion != null ? #temporals.format(c.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}">
                            13/03/2026 08:00
                        </td>

                        <td class="text-center">
                            <div class="d-flex flex-wrap justify-content-center gap-2">

                                <a th:href="@{/clases/{id}/asistencias(id=${c.id})}"
                                   class="btn btn-success btn-sm">
                                    <span th:text="${#authorization.expression('hasRole(''SECRETARIA'')') ? 'Ver asistencia' : 'Tomar asistencia'}">
                                        Tomar asistencia
                                    </span>
                                </a>

                                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'')')}"
                                   th:href="@{/clases/editar/{id}(id=${c.id})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'')')}"
                                   th:href="@{/clases/eliminar/{id}(id=${c.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Seguro que deseas eliminar esta clase?');">
                                    Eliminar
                                </a>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</html>
