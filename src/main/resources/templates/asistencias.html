<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Asistencias</title>
</head>
<body>

<h3>Registrar Asistencia</h3>

<form id="formAsistencia" th:action="@{/asistencias/guardar}" method="post">

    <select name="estudianteId" id="estudianteId">
        <option th:each="e : ${estudiantes}"
                th:value="${e.id}"
                th:text="${e.nombre}">
        </option>
    </select>

    <select name="estado" id="estado">
        <option value="PRESENTE">Presente</option>
        <option value="AUSENTE">Ausente</option>
        <option value="TARDE">Tarde</option>
    </select>

    <button type="submit">Guardar</button>

</form>

<h2>Registro de Asistencias</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Estudiante</th>
        <th>Fecha</th>
        <th>Estado</th>
    </tr>

    <tr th:each="asistencia : ${asistencias}">
        <td th:text="${asistencia.id}"></td>
        <td th:text="${asistencia.estudiante.nombre}"></td>
        <td th:text="${asistencia.fecha}"></td>
        <td th:text="${asistencia.estado}"></td>
    </tr>
</table>

<br>
<a th:href="@{/menu}">Volver al menú</a>

<script src="/js/asistencias.js"></script>

</body>
</html>>
