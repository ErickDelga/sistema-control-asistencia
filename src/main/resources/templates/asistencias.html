<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Asistencias | Control</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <!-- ALERTA OK -->
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${ok}"></span>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FORM -->
    <div class="card shadow mb-4">
        <div class="card-body">

            <h5 class="card-title">Registrar Asistencia</h5>

            <form th:action="@{/asistencias/guardar}" method="post" id="formAsistencia">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Estudiante</label>
                        <select name="estudianteId" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option th:each="e : ${estudiantes}"
                                    th:value="${e.id}"
                                    th:text="${e.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Estado</label>
                        <select name="estado" class="form-select" required>
                            <option value="">Seleccione</option>
                            <option value="PRESENTE">Presente</option>
                            <option value="AUSENTE">Ausente</option>
                            <option value="TARDE">Tarde</option>
                        </select>
                    </div>

                </div>

                <div class="mt-3">
                    <button class="btn btn-success">
                        Registrar
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- TABLA -->
    <div class="card shadow">
        <div class="card-body">

            <h5 class="card-title">Historial</h5>

            <div class="table-responsive">
                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Estudiante</th>
                        <th>Estado</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="a : ${asistencias}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${a.fecha}"></td>
                        <td th:text="${a.estudiante.nombre}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${a.estado.name() == 'PRESENTE'} ? 'bg-success' :
                                                  (${a.estado.name() == 'AUSENTE'} ? 'bg-danger' : 'bg-warning')"
                                  th:text="${a.estado}">
                            </span>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<script th:src="@{/js/asistencias.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
