<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estudiantes</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>

    <div class="d-flex justify-content-between mb-3">
        <h4>Lista de Estudiantes</h4>
        <a th:href="@{/estudiantes/nuevo}" class="btn btn-primary">Nuevo Estudiante</a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Grado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="estudiante : ${estudiantes}">
                    <td th:text="${estudiante.id}"></td>
                    <td th:text="${estudiante.nombre}"></td>
                    <td th:text="${estudiante.grado}"></td>
                    <td>
                        <a th:href="@{/estudiantes/editar/{id}(id=${estudiante.id})}"
                           class="btn btn-warning btn-sm">Editar</a>

                        <a th:href="@{/estudiantes/eliminar/{id}(id=${estudiante.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que deseas eliminar?')">
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
