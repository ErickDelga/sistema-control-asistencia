<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="mb-1">Gestión de estudiantes</h2>
            <p class="text-muted mb-0">
                Consulta y administración de estudiantes registrados.
            </p>
        </div>

        <div class="d-flex flex-wrap gap-2"
             th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'')')}">
            <a th:href="@{/estudiantes/crear}" class="btn btn-primary">
                Nuevo estudiante
            </a>

            <a th:href="@{/estudiantes/subir-csv}" class="btn btn-success">
                Subir CSV
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(estudiantes)}" class="alert alert-warning mb-0">
                No hay estudiantes registrados.
            </div>

            <div th:unless="${#lists.isEmpty(estudiantes)}" class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Nombre completo</th>
                        <th>Año</th>
                        <th>Tipo Bachillerato</th>
                        <th>Sección</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="e : ${estudiantes}">
                        <td th:text="${e.id}">1</td>

                        <td class="text-center">
                            <img th:if="${e.foto != null and !#strings.isEmpty(e.foto)}"
                                 th:src="@{'/uploads/' + ${e.foto}}"
                                 alt="Foto del estudiante"
                                 class="rounded border"
                                 style="width:50px; height:50px; object-fit:cover;">

                            <span th:if="${e.foto == null or #strings.isEmpty(e.foto)}"
                                  class="badge text-bg-secondary">
                                Sin foto
                            </span>
                        </td>

                        <td th:text="${e.nombreCompleto}">Nombre</td>
                        <td th:text="${e.anio}">PRIMERO</td>
                        <td th:text="${e.tipoBachillerato}">GENERAL</td>
                        <td th:text="${e.seccion}">A</td>

                        <td class="text-center">
                            <div class="d-flex flex-wrap justify-content-center gap-2">

                                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'')')}"
                                   th:href="@{/estudiantes/editar/{id}(id=${e.id})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''RECTORIA'',''DOCENTE'')')}"
                                   th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Seguro que deseas eliminar este estudiante?');">
                                    Eliminar
                                </a>

                                <span th:if="${#authorization.expression('hasRole(''SECRETARIA'')')}"
                                      class="badge text-bg-secondary">
                                    Solo consulta
                                </span>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</html>
