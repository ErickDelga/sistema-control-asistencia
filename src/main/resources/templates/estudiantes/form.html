<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

  <div class="page-header">
    <div>
      <h2 class="page-title"
          th:text="${estudiante.id != null} ? 'Editar estudiante' : 'Registrar estudiante'">
        Registrar estudiante
      </h2>
      <p class="page-subtitle">
        Completa la información del estudiante.
      </p>
    </div>

    <a th:href="@{/estudiantes}" class="btn btn-outline-secondary">
      Volver
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-9">

      <div class="card shadow-sm border-0">
        <div class="card-body">

          <form th:action="@{/estudiantes/guardar}"
                th:object="${estudiante}"
                method="post"
                enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{foto}">
            <input type="hidden" th:field="*{activo}">
            <input type="hidden" th:field="*{excluidoInactivacionAutomatica}">
            <input type="hidden" th:field="*{fechaCambioEstado}">
            <input type="hidden" th:field="*{motivoCambioEstado}">

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombres</label>
                <input type="text"
                       class="form-control"
                       th:field="*{nombres}"
                       placeholder="Ejemplo: José Antonio"
                       required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Apellidos</label>
                <input type="text"
                       class="form-control"
                       th:field="*{apellidos}"
                       placeholder="Ejemplo: Hernández López"
                       required>
              </div>
            </div>

            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label">Año</label>
                <select class="form-select" th:field="*{anio}" required>
                  <option value="">Seleccione un año</option>
                  <option value="PRIMERO">PRIMERO</option>
                  <option value="SEGUNDO">SEGUNDO</option>
                  <option value="TERCERO">TERCERO</option>
                </select>
              </div>

              <div class="col-md-5">
                <label class="form-label">Tipo Bachillerato</label>
                <select class="form-select" th:field="*{tipoBachillerato}" required>
                  <option value="">Seleccione un tipo</option>
                  <option value="BACHILLERATO_GENERAL">Bachillerato General</option>
                  <option value="TECNICO_PRODUCTIVO_EN_SALUD_Y_BIENESTAR_SOCIAL">Técnico Productivo en Salud y Bienestar Social</option>
                  <option value="ADMINISTRATIVO_CONTABLE">Administrativo Contable</option>
                  <option value="INFRAESTRUCTURA_TECNOLOGICA_Y_SERVICIOS_INFORMATICOS">Infraestructura Tecnológica y Servicios Informáticos</option>
                </select>
              </div>

              <div class="col-md-3">
                <label class="form-label">Sección</label>
                <input type="text"
                       class="form-control"
                       th:field="*{seccion}"
                       placeholder="Ej: A"
                       maxlength="1"
                       style="text-transform: uppercase;"
                       required>
              </div>
            </div>

            <div class="mt-4">
              <label class="form-label">Foto del estudiante (opcional)</label>
              <input type="file"
                     name="fotoFile"
                     class="form-control"
                     accept="image/*">
              <div class="form-text">
                Formatos recomendados: JPG, PNG o WEBP. Tamaño máximo: 5 MB.
              </div>
            </div>

            <div class="mt-3" th:if="${estudiante.foto != null and !#strings.isEmpty(estudiante.foto)}">
              <label class="form-label">Foto actual</label>
              <div>
                <img th:src="@{'/uploads/' + ${estudiante.foto}}"
                     alt="Foto actual del estudiante"
                     class="rounded border"
                     style="width:100px; height:100px; object-fit:cover;">
              </div>
            </div>

            <div class="alert alert-info mt-4 mb-4">
              Verifica correctamente nombres, apellidos, año, tipo de bachillerato y sección antes de guardar.
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary">
                Guardar estudiante
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      const seccionInput = document.querySelector('[name="seccion"]');

      if (seccionInput) {
        seccionInput.addEventListener('input', function () {
          this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').substring(0, 1);
        });
      }
    })();
  </script>

</div>

</html>
