<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Estudiante</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

  <div class="card shadow">
    <div class="card-body">

      <h4 th:text="${estudiante.id != null} ? 'Editar Estudiante' : 'Nuevo Estudiante'"></h4>

      <form th:action="@{/estudiantes/guardar}"
            th:object="${estudiante}"
            method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label>Nombre</label>
          <input th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Grado</label>
          <input th:field="*{grado}" class="form-control" required>
        </div>

        <button class="btn btn-success">Guardar</button>
        <a th:href="@{/estudiantes}" class="btn btn-secondary">Cancelar</a>

      </form>

    </div>
  </div>

</div>

</body>
</html>
