<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h2 class="mb-1"
          th:text="${estudiante.id != null} ? 'Editar estudiante' : 'Registrar estudiante'">
        Registrar estudiante
      </h2>
      <p class="text-muted mb-0">
        Completa la información del estudiante.
      </p>
    </div>

    <a th:href="@{/estudiantes}" class="btn btn-outline-secondary">
      Volver
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <div class="card shadow-sm border-0">
        <div class="card-body">

          <form th:action="@{/estudiantes/guardar}"
                th:object="${estudiante}"
                method="post"
                enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{foto}">

            <div class="mb-3">
              <label class="form-label">Nombre completo</label>
              <input type="text"
                     class="form-control"
                     th:field="*{nombreCompleto}"
                     placeholder="Ejemplo: José Antonio Hernández López"
                     required>
            </div>

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Año</label>
                <select class="form-select" th:field="*{anio}" required>
                  <option value="">Seleccione un año</option>
                  <option value="PRIMERO">PRIMERO</option>
                  <option value="SEGUNDO">SEGUNDO</option>
                  <option value="TERCERO">TERCERO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Tipo Bachillerato</label>
                <select class="form-select" th:field="*{tipoBachillerato}" required>
                  <option value="">Seleccione un tipo</option>
                  <option value="GENERAL">GENERAL</option>
                  <option value="TECNICO">TECNICO</option>
                  <option value="CONTADOR">CONTADOR</option>
                  <option value="SALUD">SALUD</option>
                  <option value="SOFTWARE">SOFTWARE</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Sección</label>
                <input type="text"
                       class="form-control"
                       th:field="*{seccion}"
                       placeholder="Ej: A"
                       maxlength="1"
                       style="text-transform: uppercase;"
                       required>
              </div>
            </div>

            <div class="mt-4">
              <label class="form-label">Foto del estudiante (opcional)</label>
              <input type="file"
                     name="fotoFile"
                     class="form-control"
                     accept="image/*">

              <div class="form-text">
                Este campo es opcional. Si no subes una foto, el estudiante se registrará normalmente.
              </div>
            </div>

            <div class="mt-3" th:if="${estudiante.foto != null and !#strings.isEmpty(estudiante.foto)}">
              <label class="form-label">Foto actual</label>
              <div>
                <img th:src="@{'/uploads/' + ${estudiante.foto}}"
                     alt="Foto actual del estudiante"
                     class="rounded border"
                     style="width:100px; height:100px; object-fit:cover;">
              </div>
            </div>

            <div class="alert alert-info mt-4 mb-4">
              Usa el nombre completo del estudiante y selecciona correctamente su año, tipo de bachillerato y sección.
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-success">
                Guardar estudiante
              </button>

              <a th:href="@{/estudiantes}" class="btn btn-outline-secondary">
                Cancelar
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</div>

</html>
