<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Dashboard - Sistema de Asistencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h1 class="mb-3">Dashboard de Asistencia</h1>

    <p>
        Fecha seleccionada:
        <strong th:text="${fechaSeleccionada}"></strong>
    </p>

    <div class="row text-center mb-4">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Presentes</h5>
                    <h2 th:text="${presentes}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Ausentes</h5>
                    <h2 th:text="${ausentes}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Tarde</h5>
                    <h2 th:text="${tarde}">0</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow">
        <div class="card-body">

            <canvas id="grafico"></canvas>

        </div>
    </div>

</div>

<script th:inline="javascript">

    const presentes = [[${presentes}]];
    const ausentes = [[${ausentes}]];
    const tarde = [[${tarde}]];

    new Chart(document.getElementById('grafico'),{
    type:'pie',
    data:{
    labels:['Presentes','Ausentes','Tarde'],
    datasets:[{
    data:[presentes,ausentes,tarde],
    backgroundColor:['green','red','orange']
    }]
    }
    });

</script>

</body>
</html>
