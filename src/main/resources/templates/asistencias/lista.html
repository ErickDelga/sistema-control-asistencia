<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="mb-1">Registro de asistencias</h2>
            <p class="text-muted mb-0">
                Consulta general de asistencias registradas.
            </p>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/asistencias}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Filtrar por fecha</label>
                    <input type="date"
                           name="fecha"
                           class="form-control"
                           th:value="${fechaSeleccionada}">
                </div>

                <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary">
                        Filtrar
                    </button>
                </div>

                <div class="col-md-auto">
                    <a th:href="@{/asistencias}" class="btn btn-outline-secondary">
                        Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(asistencias)}" class="alert alert-warning mb-0">
                No hay asistencias registradas.
            </div>

            <div th:unless="${#lists.isEmpty(asistencias)}" class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha y hora</th>
                        <th>Estudiante</th>
                        <th>Asignatura</th>
                        <th>Año</th>
                        <th>Tipo Bachillerato</th>
                        <th>Sección</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${asistencias}">
                        <td th:text="${a.id}">1</td>
                        <td th:text="${#temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm')}">13/03/2026 08:00</td>
                        <td th:text="${a.estudiante.nombreCompleto}">Estudiante</td>
                        <td th:text="${a.clase != null ? a.clase.asignatura : 'Sin clase'}">Asignatura</td>
                        <td th:text="${a.estudiante.anio}">Año</td>
                        <td th:text="${a.estudiante.tipoBachillerato}">Tipo</td>
                        <td th:text="${a.estudiante.seccion}">A</td>
                        <td>
                            <span class="badge bg-success" th:if="${a.estado.name() == 'PRESENTE'}">PRESENTE</span>
                            <span class="badge bg-danger" th:if="${a.estado.name() == 'AUSENTE'}">AUSENTE</span>
                            <span class="badge bg-warning text-dark" th:if="${a.estado.name() == 'TARDE'}">TARDE</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

</html>
