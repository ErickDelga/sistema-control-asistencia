<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
            <h2 class="mb-1">Tomar asistencia</h2>
            <p class="text-muted mb-1">
                <strong>Asignatura:</strong>
                <span th:text="${clase.asignatura}">Asignatura</span>
            </p>
            <p class="text-muted mb-0">
                <strong>Sección:</strong>
                <span th:text="${clase.anio}">Año</span> -
                <span th:text="${clase.tipoBachillerato}">Tipo</span> -
                <span th:text="${clase.seccion}">Sección</span>
            </p>
        </div>

        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/clases}" class="btn btn-outline-secondary">
                Volver a clases
            </a>
            <a th:href="@{/asistencias}" class="btn btn-outline-dark">
                Ver asistencias
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(estudiantes)}" class="alert alert-warning mb-0">
                No hay estudiantes asignados a esta clase.
            </div>

            <div th:unless="${#lists.isEmpty(estudiantes)}">
                <div class="mb-3">
                    <p class="mb-0 text-muted">
                        Total de estudiantes:
                        <strong th:text="${#lists.size(estudiantes)}">0</strong>
                    </p>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th style="min-width: 70px;">ID</th>
                            <th style="min-width: 90px;">Foto</th>
                            <th style="min-width: 220px;">Nombre</th>
                            <th style="min-width: 110px;">Año</th>
                            <th style="min-width: 170px;">Tipo</th>
                            <th style="min-width: 100px;">Sección</th>
                            <th style="min-width: 280px;" class="text-center">Asistencia</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="est : ${estudiantes}">
                            <td th:text="${est.id}">1</td>

                            <td class="text-center">
                                <img th:if="${est.foto != null and !#strings.isEmpty(est.foto)}"
                                     th:src="@{'/uploads/' + ${est.foto}}"
                                     alt="Foto del estudiante"
                                     class="rounded border"
                                     style="width:60px; height:60px; object-fit:cover;">

                                <div th:if="${est.foto == null or #strings.isEmpty(est.foto)}"
                                     class="small text-muted">
                                    Sin foto
                                </div>
                            </td>

                            <td th:text="${est.nombreCompleto}">Nombre completo</td>
                            <td th:text="${est.anio}">Año</td>
                            <td th:text="${est.tipoBachillerato}">Tipo</td>
                            <td th:text="${est.seccion}">A</td>

                            <td class="text-center">
                                <div class="d-flex flex-wrap justify-content-center gap-2">

                                    <form th:action="@{/asistencias/guardar}" method="post" class="d-inline">
                                        <input type="hidden" name="estudianteId" th:value="${est.id}">
                                        <input type="hidden" name="estado" value="PRESENTE">
                                        <input type="hidden" name="claseId" th:value="${clase.id}">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            Presente
                                        </button>
                                    </form>

                                    <form th:action="@{/asistencias/guardar}" method="post" class="d-inline">
                                        <input type="hidden" name="estudianteId" th:value="${est.id}">
                                        <input type="hidden" name="estado" value="AUSENTE">
                                        <input type="hidden" name="claseId" th:value="${clase.id}">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            Ausente
                                        </button>
                                    </form>

                                    <form th:action="@{/asistencias/guardar}" method="post" class="d-inline">
                                        <input type="hidden" name="estudianteId" th:value="${est.id}">
                                        <input type="hidden" name="estado" value="TARDE">
                                        <input type="hidden" name="claseId" th:value="${clase.id}">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-warning btn-sm">
                                            Tarde
                                        </button>
                                    </form>

                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

</html>
