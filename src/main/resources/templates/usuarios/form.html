<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

  <div class="page-header">
    <div>
      <h2 class="page-title" th:text="${modoEdicion} ? 'Editar usuario' : 'Crear usuario'">Usuario</h2>
      <p class="page-subtitle">Completa la información del usuario.</p>
    </div>

    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
      Volver
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <div th:if="${errorFormulario}" class="alert alert-danger" th:text="${errorFormulario}"></div>

      <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text"
                 th:field="*{nombreCompleto}"
                 class="form-control"
                 id="nombreCompleto"
                 placeholder="Ejemplo: Erick Edgardo Delgado Palacios"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text"
                 th:field="*{username}"
                 class="form-control"
                 id="username"
                 placeholder="Se generará automáticamente">
          <div class="form-text">
            Sugerencia automática: 2 letras del primer nombre + 6 letras del primer apellido.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" th:text="${modoEdicion} ? 'Nueva contraseña' : 'Contraseña'">Contraseña</label>
          <input type="password"
                 th:field="*{password}"
                 class="form-control"
                 th:placeholder="${modoEdicion ? 'Déjala vacía si no deseas cambiarla' : 'Ingresa una contraseña'}"
                 th:required="${!modoEdicion}">
        </div>

        <div class="mb-4">
          <label class="form-label">Rol</label>
          <select th:field="*{rol}" class="form-select" id="rolSelect" required>
            <option value="">Seleccione un rol</option>
            <option th:each="rol : ${roles}"
                    th:value="${rol.name()}"
                    th:text="${rol}">
            </option>
          </select>
        </div>

        <div id="bloqueDocente" class="border rounded p-3 bg-light mb-4 d-none">
          <h5 class="mb-3">Asignación del docente</h5>

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Año asignado</label>
              <select th:field="*{anioAsignado}" class="form-select">
                <option value="">Seleccione un año</option>
                <option th:each="anio : ${anios}"
                        th:value="${anio.name()}"
                        th:text="${anio}">
                </option>
              </select>
            </div>

            <div class="col-md-5">
              <label class="form-label">Tipo de bachillerato asignado</label>
              <select th:field="*{tipoBachilleratoAsignado}" class="form-select">
                <option value="">Seleccione un tipo</option>
                <option th:each="tipo : ${tiposBachillerato}"
                        th:value="${tipo.name()}"
                        th:text="${tipo.nombreVisible}">
                </option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label">Sección asignada</label>
              <input type="text"
                     th:field="*{seccionAsignada}"
                     class="form-control"
                     maxlength="1"
                     placeholder="Ej: A"
                     style="text-transform: uppercase;">
            </div>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
        const nombreInput = document.getElementById('nombreCompleto');
        const usernameInput = document.getElementById('username');
        const rolSelect = document.getElementById('rolSelect');
        const bloqueDocente = document.getElementById('bloqueDocente');
        const seccionInput = document.querySelector('[name="seccionAsignada"]');
        const anioSelect = document.querySelector('[name="anioAsignado"]');
        const tipoSelect = document.querySelector('[name="tipoBachilleratoAsignado"]');

        function normalizar(texto) {
            if (!texto) return '';
            return texto
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function obtenerPrimerApellido(partes) {
            if (partes.length >= 3) {
                return partes[2];
            }
            if (partes.length >= 2) {
                return partes[1];
            }
            return '';
        }

        function generarUsername(nombreCompleto) {
            const limpio = normalizar(nombreCompleto);
            if (!limpio) return '';

            const partes = limpio.split(' ').filter(Boolean);
            if (partes.length === 0) return '';

            const primerNombre = partes[0] || '';
            const primerApellido = obtenerPrimerApellido(partes);

            const parteNombre = primerNombre.substring(0, 2);
            const parteApellido = primerApellido.substring(0, 6);

            return (parteNombre + parteApellido).replace(/[^a-z0-9]/g, '');
        }

        function actualizarUsername() {
            if (!nombreInput || !usernameInput) return;
            usernameInput.value = generarUsername(nombreInput.value);
        }

        function limpiarCamposDocente() {
            if (anioSelect) anioSelect.value = '';
            if (tipoSelect) tipoSelect.value = '';
            if (seccionInput) seccionInput.value = '';
        }

        function toggleBloqueDocente() {
            if (rolSelect && rolSelect.value === 'DOCENTE') {
                bloqueDocente.classList.remove('d-none');
            } else {
                bloqueDocente.classList.add('d-none');
                limpiarCamposDocente();
            }
        }

        if (nombreInput && usernameInput) {
            nombreInput.addEventListener('input', actualizarUsername);
            nombreInput.addEventListener('change', actualizarUsername);
            actualizarUsername();
        }

        if (usernameInput) {
            usernameInput.addEventListener('input', function () {
                this.value = normalizar(this.value).replace(/\s+/g, '');
            });
        }

        if (seccionInput) {
            seccionInput.addEventListener('input', function () {
                this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').substring(0, 1);
            });
        }

        if (rolSelect) {
            rolSelect.addEventListener('change', toggleBloqueDocente);
            toggleBloqueDocente();
        }
    })();
  </script>

</div>
</html>
