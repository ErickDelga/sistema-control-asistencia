<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">

<div th:fragment="contenido" class="py-4">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h2 class="mb-1">Usuarios</h2>
      <p class="text-muted mb-0">
        Gestión de usuarios y roles del sistema.
      </p>
    </div>

    <a th:href="@{/usuarios/crear}" class="btn btn-primary">
      Nuevo usuario
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <div th:if="${#lists.isEmpty(usuarios)}" class="alert alert-warning mb-0">
        No hay usuarios registrados.
      </div>

      <div th:unless="${#lists.isEmpty(usuarios)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle mb-0">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Nombre completo</th>
            <th>Rol</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">admin</td>
            <td th:text="${u.nombreCompleto}">Administrador General</td>
            <td>
              <span class="badge text-bg-primary" th:if="${u.rol.name() == 'ADMIN'}">ADMIN</span>
              <span class="badge text-bg-success" th:if="${u.rol.name() == 'RECTORIA'}">RECTORIA</span>
              <span class="badge text-bg-warning text-dark" th:if="${u.rol.name() == 'DOCENTE'}">DOCENTE</span>
              <span class="badge text-bg-secondary" th:if="${u.rol.name() == 'SECRETARIA'}">SECRETARIA</span>
            </td>

            <td class="text-center">
              <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                   class="btn btn-warning btn-sm">
                  Editar
                </a>

                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                  Eliminar
                </a>
              </div>
            </td>
          </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

</div>

</html>
