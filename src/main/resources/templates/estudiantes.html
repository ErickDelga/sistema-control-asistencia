<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estudiantes | Control de Asistencia</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR (fragmento reutilizable) -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <!-- ✅ MENSAJE OK (AQUÍ VA — arriba del formulario) -->
    <div th:if="${ok}" class="alert alert-success shadow-sm">
        <span th:text="${ok}"></span>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow mb-4">
        <div class="card-body">

            <h5 class="card-title mb-3">Nuevo Estudiante</h5>

            <form id="formEstudiante"
                  th:action="@{/estudiantes/guardar}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               class="form-control"
                               name="nombre"
                               id="nombre"
                               placeholder="Nombre completo"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Grado</label>
                        <input type="text"
                               class="form-control"
                               name="grado"
                               id="grado"
                               placeholder="Ej: 1° Bachillerato A"
                               required>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        Guardar estudiante
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- TABLA -->
    <div class="card shadow">
        <div class="card-body">

            <h5 class="card-title mb-3">Lista de Estudiantes</h5>

            <div class="table-responsive">
                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Grado</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="estudiante : ${estudiantes}">
                        <td th:text="${estudiante.id}"></td>
                        <td th:text="${estudiante.nombre}"></td>
                        <td th:text="${estudiante.grado}"></td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<!-- JS -->
<script th:src="@{/js/estudiantes.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
