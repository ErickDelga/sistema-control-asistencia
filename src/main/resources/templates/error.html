<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="max-width: 700px; margin: 50px auto; font-family: Arial, sans-serif;">
    <h1>Ocurrió un problema</h1>

    <p><strong>Mensaje:</strong> <span th:text="${mensaje}">Error inesperado</span></p>
    <p><strong>Detalle:</strong> <span th:text="${detalle}">Detalle</span></p>
    <p><strong>Ruta:</strong> <span th:text="${ruta}">/ruta</span></p>

    <a th:href="@{/dashboard}">Volver al dashboard</a>
</div>
</body>
</html>
