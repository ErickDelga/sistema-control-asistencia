<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Usuarios | Control</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

  <!-- ALERTA -->
  <div th:if="${ok}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${ok}"></span>
    <button class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- FORM -->
  <div class="card shadow mb-4">
    <div class="card-body">

      <h5 class="card-title">Nuevo Usuario</h5>

      <form th:action="@{/usuarios/guardar}" method="post" id="formUsuario">

        <div class="row g-3">

          <div class="col-md-4">
            <label class="form-label">Usuario</label>
            <input name="username" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label class="form-label">Rol</label>
            <select name="rol" class="form-select">
              <option>ADMIN</option>
              <option>DOCENTE</option>
              <option>SECRETARIA</option>
            </select>
          </div>

        </div>

        <div class="mt-3">
          <button class="btn btn-primary">
            Crear Usuario
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- TABLA -->
  <div class="card shadow">
    <div class="card-body">

      <h5 class="card-title">Usuarios registrados</h5>

      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Rol</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.username}"></td>
          <td>
                        <span class="badge bg-info"
                              th:text="${u.rol}">
                        </span>
          </td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

<script th:src="@{/js/usuarios.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
