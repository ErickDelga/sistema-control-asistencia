<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menú Principal | Control de Asistencia</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
        <span class="navbar-brand">
            Sistema de Control de Asistencia
        </span>

        <div class="d-flex">
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
                Cerrar sesión
            </a>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-5">

    <div class="text-center mb-4">
        <h2>Menú Principal</h2>
        <p class="text-muted">
            Seleccione un módulo para continuar
        </p>
    </div>

    <div class="row g-4">

        <!-- ESTUDIANTES -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">

                    <h5 class="card-title">
                        Estudiantes
                    </h5>

                    <p class="card-text">
                        Crear, editar y administrar estudiantes
                    </p>

                    <a th:href="@{/estudiantes}" class="btn btn-primary">
                        Ir a estudiantes
                    </a>

                </div>
            </div>
        </div>

        <!-- ASISTENCIAS -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">

                    <h5 class="card-title">
                        Asistencias
                    </h5>

                    <p class="card-text">
                        Registrar y consultar asistencia
                    </p>

                    <a th:href="@{/asistencias}" class="btn btn-success">
                        Ir a asistencias
                    </a>

                </div>
            </div>
        </div>

        <!-- USUARIOS -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">

                    <h5 class="card-title">
                        Usuarios
                    </h5>

                    <p class="card-text">
                        Administración de usuarios y roles
                    </p>

                    <a th:href="@{/usuarios}" class="btn btn-warning">
                        Ir a usuarios
                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
